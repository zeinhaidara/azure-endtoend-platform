api:
  replicaCount: 2
  clientId: ""
  image:
    repository: batch818acr.azurecr.io/northbridge-api
    tag: latest
  service:
    port: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
worker:
  replicaCount: 2
  clientId: ""
  image:
    repository: batch818acr.azurecr.io/northbridge-worker
    tag: latest
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
config:
  logLevel: info
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
pdb:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
ingress:
  enabled: false
  className: nginx
  host: referrals.example.invalid
  tlsSecretName: referrals-tls
